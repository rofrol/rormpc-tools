[project]
name = "rormpc-tools"
version = "0.2.13"
description = "MPD music tools behind rormpc's Hits pane, play counts and delete menu: hits, musicdb, mpd-player, yt-mp3-mb, yt-playlist"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.11"
# google-*: yt-playlist (remove deleted songs from your YouTube playlists), unused until it is set up
# shazamio: mbtag's last fingerprint fallback; it imports audioop, which Python 3.13 removed
dependencies = ["python-mpd2", "mutagen", "google-auth-oauthlib", "google-api-python-client", "shazamio",
                "audioop-lts; python_version >= '3.13'"]

[project.scripts]
hits = "rormpc_tools.hits:main"
musicdb = "rormpc_tools.musicdb:main"
mpd-player = "rormpc_tools.player:main"
# the old name of mpd-player, for launchd agents installed before the rename
mpd-gap = "rormpc_tools.player:main"
yt-mp3-mb = "rormpc_tools.yt_mp3_mb:main"
yt-playlist = "rormpc_tools.yt_playlist:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
